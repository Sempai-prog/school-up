services:
  - type: web
    name: skoolup-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skoolup-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  - type: static
    name: skoolup-frontend
    plan: free
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: http://skoolup-api:10000/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: skoolup-db
    plan: free
    databaseName: skoolup
    user: skoolup
